<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gym Growth Assistant — Owner Dashboard</title>
<link rel="icon" id="pageFavicon" type="image/png" href="/static/1000920458.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root{
    --bg:#0f172a; --panel:#ffffff; --accent:#16a34a; --accent-dark:#15803d;
    --muted:#64748b; --border:#e2e8f0; --bg-soft:#f8fafc;
    --blue:#2563eb; --blue-soft:#eff6ff;
    --purple:#7c3aed; --purple-soft:#f5f3ff;
    --amber:#d97706; --amber-soft:#fffbeb;
    --teal:#0891b2; --teal-soft:#ecfeff;
    --red:#dc2626; --red-soft:#fef2f2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg-soft);color:#0f172a;}
  a{color:inherit;}

  /* ---- shell ---- */
  header{background:var(--bg);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;}
  header .brand h1{font-size:15.5px;margin:0;font-weight:700;}
  header .brand p{font-size:11.5px;margin:0;color:#94a3b8;}
  header .right{display:flex;align-items:center;gap:12px;font-size:12.5px;color:#cbd5e1;}
  .gym-select{background:#1e293b;color:#fff;border:1px solid #334155;padding:7px 10px;border-radius:8px;font-size:12.5px;}
  .demo-badge{background:#422006;color:#fed7aa;border:1px solid #92400e;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;}
  .demo-badge.live{background:#052e16;color:#bbf7d0;border-color:#166534;}

  .layout{display:flex;max-width:1480px;margin:0 auto;}
  nav{width:210px;padding:18px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);flex-shrink:0;background:#fff;}
  nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 12px;margin-bottom:3px;border:none;background:none;border-radius:8px;cursor:pointer;font-size:13.5px;color:#334155;font-weight:500;}
  nav button:hover{background:#f1f5f9;}
  nav button.active{background:#dcfce7;color:var(--accent-dark);font-weight:700;}
  nav button .ic{font-size:15px;}
  main{flex:1;padding:22px 26px 60px;min-width:0;}

  h2.page-title{font-size:19px;margin:0 0 4px;}
  p.page-sub{font-size:13px;color:var(--muted);margin:0 0 20px;}

  /* ---- generic cards / grids ---- */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}

  @media(max-width: 860px){
    header{padding:12px 14px;}
    .layout{flex-direction:column;}
    nav{width:100%;height:auto;position:sticky;top:0;z-index:25;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-wrap:nowrap;overflow-x:auto;padding:8px 10px;gap:6px;scrollbar-width:none;}
    nav::-webkit-scrollbar{display:none;}
    nav button{width:auto;white-space:nowrap;padding:7px 12px;border-radius:20px;background:#f1f5f9;flex-shrink:0;margin-bottom:0;}
    nav button.active{background:var(--accent);color:#fff;}
    main{padding:16px 12px 60px;}
    .grid-4{grid-template-columns:1fr 1fr;gap:8px;}
    .drawer{width:100vw;max-width:100vw;}
    table{min-width:550px;}
    .card{overflow-x:auto;padding:14px;}
  }

  .stat h4{margin:0 0 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
  .stat .num{font-size:26px;font-weight:800;color:#0f172a;}
  .stat .delta{font-size:11.5px;font-weight:600;margin-top:4px;}
  .delta.up{color:var(--accent-dark);}
  .delta.down{color:var(--red);}
  .section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;}
  .section-head h3{font-size:15px;margin:0;}

  .btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:#fff;color:#0f172a;border:1px solid var(--border);}
  .btn.secondary:hover{border-color:var(--accent);color:var(--accent-dark);}
  .btn.small{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.55;cursor:not-allowed;}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge.stage-New{background:#fef2f2;color:#dc2626;}
  .badge.stage-Pending{background:var(--amber-soft);color:var(--amber);}
  .badge.stage-Contacted{background:var(--blue-soft);color:var(--blue);}
  .badge.stage-TrialBooked, .badge.stage-Trialbooked{background:var(--purple-soft);color:var(--purple);}
  .badge.stage-Joined, .badge.stage-Paid, .badge.stage-Converted{background:#dcfce7;color:var(--accent-dark);}
  .badge.stage-Completed{background:var(--teal-soft);color:var(--teal);}
  .badge.stage-Lost, .badge.stage-Closed{background:var(--red-soft);color:var(--red);}

  /* ---- pipeline strip ---- */
  .pipeline{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .pipeline .stage{flex:1;min-width:120px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .pipeline .stage .n{font-size:22px;font-weight:800;}
  .pipeline .stage .l{font-size:11.5px;color:var(--muted);font-weight:600;}
  .pipeline .stage .bar{height:5px;border-radius:4px;margin-top:8px;background:#e2e8f0;overflow:hidden;}
  .pipeline .stage .bar span{display:block;height:100%;background:var(--accent);}

  /* ---- leads table ---- */
  .toolbar-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .toolbar-row input, .toolbar-row select{padding:8px 11px;border-radius:8px;border:1px solid var(--border);font-size:13px;}
  .toolbar-row input{flex:1;min-width:180px;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  thead th{background:#f8fafc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:#f8fafc;}
  .lead-name{font-weight:700;}
  .lead-sub{font-size:11.5px;color:var(--muted);}

  /* ---- drawer ---- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;z-index:20;}
  .overlay.open{display:block;}
  .drawer{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100vh;background:#fff;box-shadow:-12px 0 32px rgba(0,0,0,.18);z-index:21;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
  .drawer-head h3{margin:0 0 3px;font-size:16.5px;}
  .drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
  .drawer-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px;}
  .kv{display:grid;grid-template-columns:1fr;gap:9px;}
  .kv .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--border);}
  .kv .row span:first-child{color:var(--muted);}
  .kv .row span:last-child{font-weight:600;text-align:right;}
  .drawer-actions{display:flex;flex-wrap:wrap;gap:8px;}
  .stage-select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;}

  /* ---- payments ---- */
  .pay-box{border:1px dashed var(--border);border-radius:12px;padding:18px;text-align:center;}
  .qr{width:150px;height:150px;margin:0 auto 12px;border-radius:10px;background:
      repeating-linear-gradient(0deg,#0f172a 0 6px,#fff 6px 12px),
      repeating-linear-gradient(90deg,#0f172a 0 6px,transparent 6px 12px);
      background-blend-mode:multiply; border:8px solid #fff; outline:1px solid var(--border);}
  .pay-link{font-size:12px;background:#f1f5f9;border-radius:8px;padding:8px 10px;word-break:break-all;color:#334155;margin-bottom:10px;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:20px;}
  .status-pill.pending{background:#fffbeb;color:var(--amber);}
  .status-pill.paid{background:#dcfce7;color:var(--accent-dark);}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .status-pill.pending .dot{animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  /* ---- messaging ---- */
  .tmpl-list{display:flex;flex-direction:column;gap:8px;}
  .tmpl{border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px;}
  .tmpl:hover{border-color:var(--accent);}
  .tmpl.active{border-color:var(--accent);background:#f0fdf4;}
  .tmpl .tname{font-weight:700;margin-bottom:3px;}
  .tmpl .tprev{color:var(--muted);font-size:11.5px;}
  textarea{width:100%;min-height:100px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:13px;font-family:inherit;resize:vertical;}
  .channel-toggle{display:flex;gap:8px;margin:10px 0;}
  .channel-toggle label{display:flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--border);padding:6px 12px;border-radius:20px;cursor:pointer;}
  .log-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .log-item:last-child{border-bottom:none;}
  .chan-icon{display:inline-block;width:20px;text-align:center;}
  .log-status{font-weight:700;}
  .log-status.sent{color:var(--blue);}
  .log-status.delivered{color:var(--accent-dark);}

  /* ---- instagram ---- */
  .ig-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .ig-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);flex-shrink:0;}
  .ig-stats{display:flex;gap:20px;font-size:13px;margin-top:4px;}
  .ig-stats b{display:block;font-size:15px;}
  .feed-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .feed-tile{aspect-ratio:1;border-radius:10px;position:relative;overflow:hidden;color:#fff;font-size:11px;padding:8px;display:flex;align-items:flex-end;font-weight:600;}
  .feed-tile span{background:rgba(0,0,0,.35);padding:3px 6px;border-radius:6px;}
  .switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:20px;transition:.2s;}
  .slider:before{content:"";position:absolute;height:15px;width:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--accent);}
  input:checked + .slider:before{transform:translateX(17px);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border);margin-top:10px;}
  .toggle-row .t{font-size:13px;font-weight:600;}
  .toggle-row .d{font-size:11.5px;color:var(--muted);}

  /* ---- reviews ---- */
  .rating-summary{display:flex;gap:22px;align-items:center;}
  .rating-summary .big{font-size:42px;font-weight:800;}
  .stars{color:#f59e0b;font-size:15px;}
  .bars{flex:1;display:flex;flex-direction:column;gap:5px;}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
  .bar-row .track{flex:1;height:7px;background:#f1f5f9;border-radius:4px;overflow:hidden;}
  .bar-row .track span{display:block;height:100%;background:#f59e0b;}
  .review{border-bottom:1px solid var(--border);padding:14px 0;}
  .review:last-child{border-bottom:none;}
  .review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .review-name{font-weight:700;font-size:13px;}
  .sentiment{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;}
  .sentiment.Positive{background:#dcfce7;color:var(--accent-dark);}
  .sentiment.Neutral{background:#f1f5f9;color:#475569;}
  .sentiment.Negative{background:var(--red-soft);color:var(--red);}
  .review-text{font-size:12.5px;color:#334155;}
  .tag-cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .tag-cloud span{font-size:11.5px;padding:5px 11px;border-radius:20px;background:#f1f5f9;color:#334155;}
  .tag-cloud span.neg{background:var(--red-soft);color:var(--red);}
  .req-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .req-row:last-child{border-bottom:none;}

  .empty-note{font-size:11.5px;color:var(--muted);background:#f8fafc;border:1px dashed var(--border);border-radius:8px;padding:9px 12px;margin-top:10px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">🏋️</div>
    <div><h1>Gym Growth Assistant</h1><p>Owner dashboard</p></div>
  </div>
  <div class="right">
    <select class="gym-select" id="gymSelect"><option id="gymSelectOption">Downtown Fitness — Chennai</option></select>
    <span id="todayLabel"></span>
    <span class="demo-badge" id="dataBadge">Demo preview — sample data</span>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>

<script>
/* ============================ LIVE BACKEND ============================ */
// Falls back to the sample data below whenever the backend isn't reachable,
// so the dashboard still works as a standalone demo — same pattern as
// index.html / chat.html.
const API = window.GYM_AI_API_BASE || (
  window.location.origin && !window.location.origin.includes("null") && !window.location.origin.includes("file:")
    ? window.location.origin
    : "http://localhost:8000"
);
const GYM_ID = new URLSearchParams(location.search).get("gym") || window.GYM_AI_GYM_ID || "downtown-fitness";
let usingLiveData = false;
let liveStats = null;

/* ============================ LIVE BACKEND ============================ */
function parseInterest(text){
  const out = {};
  (text || "").split(";").forEach(part => {
    const idx = part.indexOf(":");
    if(idx < 0) return;
    const k = part.slice(0, idx).trim().toLowerCase();
    const v = part.slice(idx + 1).trim();
    if(!v) return;
    if(k.includes("goal")) out.goal = v;
    else if(k.includes("pt")) out.pt = v;
    else if(k.includes("duration")) out.duration = v;
  });
  return out;
}

function mapBackendLead(rec, idx){
  const parsed = parseInterest(rec.interest);
  const when = rec.ts ? new Date(rec.ts * 1000) : null;
  return {
    id: "live-" + idx,
    name: rec.name || "Unknown",
    phone: rec.phone || "—",
    locality: "—",
    source: (function(ch){
      if(ch === "whatsapp") return "WhatsApp Bot";
      if(ch === "form") return "Website Form";
      if(ch === "trial") return "Trial Booking";
      return "Website Chat";
    })(rec.channel),
    goal: parsed.goal || "—",
    preferredTime: rec.preferred_time || "—",
    joinDate: "—",
    plan: parsed.duration || "—",
    pt: parsed.pt || "—",
    language: "—",
    trainerPref: "—",
    trial: "—",
    attendance: "—",
    stage: rec.status === "Converted" ? "Joined" : (rec.status || "New"),
    value: 0,
    consent: "Given",
    lastInteraction: rec.interest || "Enquired via chat",
    nextAction: rec.status === "Joined" ? "Onboarding active" : (rec.status === "Pending" ? "Follow-up required" : "Contact lead"),
    _when: when ? when.toLocaleDateString("en-IN", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) : "—",
  };
}

let liveIdentity = null;

async function loadRealData(){
  try{
    const [leadsRes, statsRes, infoRes] = await Promise.all([
      fetch(`${API}/api/gym/${GYM_ID}/leads`),
      fetch(`${API}/api/gym/${GYM_ID}/stats`),
      fetch(`${API}/api/gym/${GYM_ID}/info`),
    ]);
    if(leadsRes.ok){
      const raw = await leadsRes.json();
      if(raw && raw.length){
        leads = raw.map(mapBackendLead);
        usingLiveData = true;
      }
    }
    if(statsRes.ok){
      liveStats = await statsRes.json();
      usingLiveData = true;
    }
    if(infoRes.ok){
      liveIdentity = await infoRes.json();
      usingLiveData = true;
      const opt = document.getElementById("gymSelectOption");
      if(opt && liveIdentity.gym_name){
        opt.textContent = liveIdentity.gym_name + (liveIdentity.city ? " — " + liveIdentity.city : "");
      }
    }
  }catch(e){
    // backend not reachable at API — dashboard stays in demo mode with sample data
  }
  const badge = document.getElementById("dataBadge");
  if(usingLiveData && badge){
    badge.textContent = "Live data — " + GYM_ID;
    badge.classList.add("live");
  }
  renderAll();
}

/* ============================= DATA (sample) ============================= */
const STAGES = ["New","Contacted","Trial Booked","Attended","Payment Sent","Paid","Lost"];
const stageClass = s => "stage-" + s.replace(/\s+/g,"");

let leads = [
  {id:1,name:"Arjun Menon",phone:"+91 98470 11223",locality:"Aluva",source:"Instagram",goal:"Weight loss",preferredTime:"Early morning",joinDate:"18 Aug",plan:"Quarterly",pt:"Interested",language:"Malayalam",trainerPref:"No preference",trial:"12 Aug, 7:00 AM",attendance:"—",stage:"New",value:0,consent:"Given",lastInteraction:"Enquired via IG DM",nextAction:"Call to qualify"},

  {id:3,name:"Rahul Nair",phone:"+91 90720 88451",locality:"Kalamassery",source:"Referral",goal:"Muscle gain",preferredTime:"Evening",joinDate:"10 Aug",plan:"Annual",pt:"Interested",language:"Malayalam",trainerPref:"No preference",trial:"9 Aug, 6:00 PM",attendance:"Attended",stage:"Trial Booked",value:0,consent:"Given",lastInteraction:"Trial booked, trainer assigned",nextAction:"Follow up after trial"},
  {id:4,name:"Sneha Pillai",phone:"+91 88484 22190",locality:"Angamaly",source:"Website",goal:"Weight loss",preferredTime:"Morning",joinDate:"8 Aug",plan:"Quarterly",pt:"Interested",language:"English",trainerPref:"Female trainer",trial:"8 Aug, 8:00 AM",attendance:"Attended",stage:"Attended",value:0,consent:"Given",lastInteraction:"Completed trial class",nextAction:"Send plan + payment link"},
  {id:5,name:"Vishnu Prasad",phone:"+91 94001 34567",locality:"Aluva",source:"Facebook",goal:"General fitness",preferredTime:"Evening",joinDate:"6 Aug",plan:"Monthly",pt:"Not interested",language:"Malayalam",trainerPref:"No preference",trial:"6 Aug, 7:00 PM",attendance:"Attended",stage:"Payment Sent",value:1499,consent:"Given",lastInteraction:"Payment link sent on WhatsApp",nextAction:"Confirm payment"},
  {id:6,name:"Meera Krishnan",phone:"+91 97460 90233",locality:"Kalamassery",source:"Google",goal:"Rehabilitation",preferredTime:"Morning",joinDate:"2 Aug",plan:"Quarterly",pt:"Interested",language:"English",trainerPref:"Female trainer",trial:"2 Aug, 8:30 AM",attendance:"Attended",stage:"Paid",value:3999,consent:"Given",lastInteraction:"Payment received, membership active",nextAction:"Add to onboarding batch"},
  {id:7,name:"Anoop Varghese",phone:"+91 99610 77812",locality:"Angamaly",source:"Instagram",goal:"Muscle gain",preferredTime:"Evening",joinDate:"29 Jul",plan:"Annual",pt:"Interested",language:"Malayalam",trainerPref:"No preference",trial:"29 Jul, 6:00 PM",attendance:"Attended",stage:"Paid",value:12999,consent:"Given",lastInteraction:"Renewed for a year",nextAction:"Request Google review"},
  {id:8,name:"Fathima Rasheed",phone:"+91 91234 56780",locality:"Aluva",source:"Referral",goal:"Weight loss",preferredTime:"Morning",joinDate:"—",plan:"Monthly",pt:"Not interested",language:"Malayalam",trainerPref:"Female trainer",trial:"20 Jul, 7:30 AM",attendance:"No-show",stage:"Lost",value:0,consent:"Withdrawn",lastInteraction:"Missed trial, unresponsive",nextAction:"Win-back message"},
  {id:9,name:"Karthik Iyer",phone:"+91 90480 22341",locality:"Kalamassery",source:"Website",goal:"General fitness",preferredTime:"Evening",joinDate:"—",plan:"Monthly",pt:"Interested",language:"English",trainerPref:"No preference",trial:"—",attendance:"—",stage:"New",value:0,consent:"Given",lastInteraction:"Submitted enquiry form",nextAction:"Call to qualify"},
  {id:10,name:"Lakshmi Menon",phone:"+91 99465 33210",locality:"Angamaly",source:"Google",goal:"Weight loss",preferredTime:"Morning",joinDate:"5 Aug",plan:"Quarterly",pt:"Interested",language:"Malayalam",trainerPref:"Female trainer",trial:"5 Aug, 8:00 AM",attendance:"Attended",stage:"Paid",value:3999,consent:"Given",lastInteraction:"Payment received",nextAction:"Request Google review"},

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtRs(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
function leadById(id){ return leads.find(l=>l.id===id); }
function fillTemplate(body, lead){
  return body
    .replace(/{name}/g, lead ? lead.name.split(" ")[0] : "there")
    .replace(/{gym}/g, "Downtown Fitness")
    .replace(/{trial}/g, lead ? lead.trial : "your scheduled time")

}

function generatePaymentLink(){
  const leadId = Number(document.getElementById("payLeadSelect").value);
  const amount = Number(document.getElementById("payAmount").value) || 1499;
  const lead = leadById(leadId);
  pendingPayment = { leadId, amount, plan: lead.plan, status:"pending", link: "pay.gymassist.in/dtf/" + leadId + Math.random().toString(36).slice(2,6) };

  setTimeout(() => {

    pendingPayment.status = "paid";
    transactions.push({lead:lead.name, plan:lead.plan, amount, method:"UPI", status:"Paid", date:"Today"});
    lead.stage = "Paid"; lead.value = amount;
    renderPayResult();
  }, 3500);
}

    <p class="page-sub">Keep your page active and turn good reviews and offers into posts automatically.</p>

    <div class="card">
      <div class="ig-header">

          <div style="font-weight:700;"><a href="${igUrl}" target="_blank" rel="noopener" style="color:inherit;">${handle || "View profile"}</a></div>
          <div class="lead-sub">Linked from Gym Identity</div>
          <div class="ig-stats">
            <div><b>—</b>Followers</div>
            <div><b>—</b>Engagement rate</div>
            <div><b>—</b>Last post</div>
          </div>
        </div>
        <div style="margin-left:auto;"><a class="btn secondary small" href="${igUrl}" target="_blank" rel="noopener">Open profile</a></div>
      </div>

      <div class="feed-grid">
        ${feedPosts.map(p=>`<div class="feed-tile" style="background:${p.color}"><span>${p.caption}</span></div>`).join("")}
      </div>

      <div class="toggle-row">
        <div><div class="t">Auto-share new 5★ reviews</div><div class="d">Posts a quote card whenever a member leaves a great review.</div></div>
        <label class="switch"><input type="checkbox" id="igAutoShareToggle" ${igAutoShare?"checked":""}/><span class="slider"></span></label>

      <div class="toggle-row">

}

/* ============================== MASTER RENDER ============================== */
function renderAll(){
  renderNav();
  const main = document.getElementById("main");
  if(activeTab==="overview") main.innerHTML = renderOverview();
  else if(activeTab==="insights") main.innerHTML = renderInsights();
  else if(activeTab==="leads") main.innerHTML = renderLeads();
  else if(activeTab==="payments") main.innerHTML = renderPayments();
  else if(activeTab==="messaging") main.innerHTML = renderMessaging();
  else if(activeTab==="instagram") main.innerHTML = renderInstagram();
  else if(activeTab==="reviews") main.innerHTML = renderReviews();
  else if(activeTab==="admin") main.innerHTML = renderAdmin();
  attachHandlers();
}

function attachHandlers(){
  document.getElementById("overlay").addEventListener("click", closeDrawer);

  if(activeTab==="leads"){
    document.getElementById("leadSearch").addEventListener("input", e => { leadFilter.q = e.target.value; renderAll(); });
    document.getElementById("stageFilter").addEventListener("change", e => { leadFilter.stage = e.target.value; renderAll(); });
    document.querySelectorAll("tbody tr[data-id]").forEach(tr => {
      tr.addEventListener("click", () => openDrawer(Number(tr.dataset.id)));
    });
    const refreshBtn = document.getElementById("refreshLeadsBtn");
    if(refreshBtn) refreshBtn.addEventListener("click", async () => {
      refreshBtn.disabled = true; refreshBtn.textContent = "Checking...";
      await loadRealData();
    });
  }

  if(activeTab==="payments"){
    document.getElementById("payLeadSelect").addEventListener("change", e => {
      composeLeadId = Number(e.target.value);
      document.getElementById("payAmount").value = planAmount(leadById(composeLeadId).plan);
    });
    document.getElementById("genLinkBtn").addEventListener("click", generatePaymentLink);
  }

  if(activeTab==="messaging"){
    document.querySelectorAll(".tmpl").forEach(el => {
      el.addEventListener("click", () => {
        selectedTemplateId = el.dataset.tid;
        renderAll();
      });
    });
    document.getElementById("msgLeadSelect").addEventListener("change", e => {
      composeLeadId = Number(e.target.value); renderAll();
    });
    document.getElementById("resetMsgBtn").addEventListener("click", () => renderAll());
    document.getElementById("sendMsgBtn").addEventListener("click", () => {
      const lead = leadById(composeLeadId);
      const tmpl = templates.find(t=>t.id===selectedTemplateId);
      const chan = document.querySelector('input[name="chan"]:checked').value;
      messageLog.push({ lead: lead.name, channel: chan, template: tmpl.name, status:"sent", time:"Just now" });
      renderAll();
      setTimeout(() => {
        const last = messageLog[messageLog.length-1];
        if(last) last.status = "delivered";
        if(activeTab==="messaging") renderAll();
      }, 1800);
    });
  }

  if(activeTab==="instagram"){
    const t = document.getElementById("igAutoShareToggle");
    if(t) t.addEventListener("change", e => { igAutoShare = e.target.checked; });
  }

  if(activeTab==="reviews"){
    document.querySelectorAll(".reviewReqBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        const lead = leadById(Number(btn.dataset.id));
        messageLog.push({ lead: lead.name, channel:"WhatsApp", template:"Review request", status:"sent", time:"Just now" });
        btn.textContent = "Sent ✓";
        btn.disabled = true;
      });
    });
  }

  if(activeTab==="payments" && pendingPayment){ renderPayResult(); }

  if(activeTab==="admin"){
    const exp = document.getElementById("exportLeadsBtn");
    if(exp) exp.addEventListener("click", () => {
      const cols = ["name","phone","locality","source","goal","stage","plan","pt","language","trainerPref","value"];
      const csv = [cols.join(",")].concat(
        leads.map(l => cols.map(c => `"${String(l[c]).replace(/"/g,'""')}"`).join(","))
      ).join("\n");
      const blob = new Blob([csv], { type:"text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "leads.csv"; document.body.appendChild(a); a.click(); a.remove();
    });
  }
}

renderAll();       // fast first paint with sample data
loadRealData();    // then swap in live leads/stats if the backend answers
setInterval(loadRealData, 30000); // keep leads/stats fresh without a manual reload
</script>
